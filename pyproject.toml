[project]
name = "noteslyt"
version = "0.1.0"
description = "Source-cited RAG tutor + adaptive assessment over your own lecture PDFs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=2.54.0",
    "pdf-inspector>=1.25",
    "firecrawl-anydoc>=0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.54.0",
    "psycopg[binary,pool]>=3.2.3",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.2.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "chromadb>=1.5.9",
]
