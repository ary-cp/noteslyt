[project]
name = "study-companion"
version = "0.1.0"
description = "Source-cited RAG tutor + adaptive assessment over your own lecture PDFs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=2.54.0",
    "pdf-inspector>=1.25",
    "firecrawl-anydoc>=0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.54.0",
]
