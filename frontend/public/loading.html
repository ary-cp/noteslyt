<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Starting NotesLyt</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #0b0b0c;
        color: #f5f5f5;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(360px, calc(100% - 48px)); text-align: center; }
      img { width: 52px; height: 52px; border-radius: 14px; box-shadow: 0 0 0 1px #28553a; }
      h1 { margin: 24px 0 8px; font-size: 18px; font-weight: 650; }
      p { margin: 0; color: #a1a1aa; font-size: 13px; line-height: 1.6; }
      .track { height: 6px; margin: 28px auto 0; overflow: hidden; border-radius: 999px; background: #1b1c1f; }
      .bar { width: 40%; height: 100%; border-radius: inherit; background: #22c55e; animation: progress 1.2s ease-in-out infinite; }
      body.startup-error .bar { animation: none; width: 100%; background: #ef4444; }
      #startup-error { display: none; margin-top: 16px; color: #fca5a5; }
      body.startup-error #startup-error { display: block; }
      @keyframes progress { from { transform: translateX(-110%); } to { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <img src="/04-app-icon-green.svg" alt="NotesLyt" />
      <h1>Starting NotesLyt</h1>
      <p id="startup-status">Preparing your workspace and connecting to the local service…</p>
      <div class="track"><div class="bar"></div></div>
      <p id="startup-error">The local service could not start. Open the data folder's logs/backend.log and restart NotesLyt.</p>
    </main>
  </body>
</html>
